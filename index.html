<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locktober tracker</title>
<style>
  :root{
    --bg:#F6F4EF;
    --card:#FFFFFF;
    --ink:#2B2A26;
    --sub:#7A7870;
    --line:#E4E1D6;
    --accent:#8A6D4B;
    --accent-soft:#EFE6D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:20px 14px 60px;
  }
  h1{font-size:20px;font-weight:600;margin:0 0 2px;}
  .sub{color:var(--sub);font-size:13px;margin:0 0 16px;line-height:1.5;}

  .cover{
    width:100%;
	aspect-ratio:4/3;
    border-radius:12px;
    border:1px dashed var(--line);
    background:var(--accent-soft) center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--sub);
    font-size:13px;
    margin-bottom:18px;
    text-align:center;
    padding:12px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  @media(min-width:480px){
    .grid{grid-template-columns:repeat(7,1fr);}
  }

  .cell{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    min-height:78px;
    overflow:hidden;
  }
  .day-num{
    position:absolute;
    top:4px;
    left:6px;
    font-size:10px;
    font-weight:700;
    color:var(--sub);
    z-index:3;
  }
  .task{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px 6px 4px;
    font-size:11px;
    color:var(--ink);
    line-height:1.3;
  }

  .scratch-cover{
    position:absolute;
    inset:0;
    z-index:2;
    cursor:pointer;
    touch-action:none;
  }
  .scratch-cover canvas{width:100%;height:100%;display:block;}
  .reset{
    position:absolute;
    bottom:3px;
    right:5px;
    font-size:9px;
    color:var(--sub);
    z-index:3;
    background:none;
    border:none;
    cursor:pointer;
    padding:2px;
  }

  .cell.locked .reset{display:none;}
  .lock{
    position:absolute;
    inset:0;
    z-index:4;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:4px;
    background:var(--card);
    color:var(--sub);
    font-size:9px;
    text-align:center;
    padding:4px;
  }
  .cell.locked .lock{display:flex;}
  .lock i{font-style:normal;font-size:15px;}

  .hint{font-size:12px;color:var(--sub);margin:16px 2px 0;line-height:1.5;}
</style>
</head>
<body>

<script>
  const MONTH_TITLE = "Locktober 2026";
  const COVER_PHOTO_URL = "https://pbs.twimg.com/media/HEBOEEIXkAAFbvr?format=jpg&name=small";
  const TASKS = [
    "Day 1: The Lock-In. Secure the device. Take a timestamped photo of the key in its designated safe spot (or sent to your keyholder).",
    "Day 2: Morning Inspection. Establish a strict 5-minute morning hygiene routine. Inspect the device for comfort and fit.",
    "Day 3: Mental Reset. Spend 10 minutes meditating on your goals for the month. Write down your personal motivations.",
    "Day 4: Friction Check. Apply a layer of high-quality, body-safe powder or lotion to prevent any early chaffing.",
    "Day 5: Hydration Focus. Drink at least 3 litres of water today to keep swelling down and circulation healthy.",
    "Day 6: Posture Check. Spend the day focusing on maintaining straight, polite posture during all sitting and standing activities.",
    "Day 7: The Week 1 Milestone. Complete a thorough deep-clean hygiene routine. No unlocking allowed unless essential for safety.",
    "Day 8: Denial Protocol. Visualise or browse your favourite triggers for 5 minutes without touching. Acknowledge the desire, then close it out.",
    "Day 9: The Distraction Trial. When an urge strikes today, you must immediately drop and do 20 jumping jacks or pushups.",
    "Day 10: Task of Service. Perform an unprompted act of kindness or a tedious chore for your partner, keyholder, or household.",
    "Day 11: Mid-Month Maintenance. Check the physical integrity of the lock/spacer. Document your current mood scale (1–10).",
    "Day 12: Sensory Focus. Spend 15 minutes listening to a guided denial or obedience audio clip.",
    "Day 13: Absolute Stillness. Sit perfectly still in a chair for 10 minutes with zero screen distractions. Focus entirely on the restriction.",
    "Day 14: Digital Fast. No social media or adult content for the entire day. Pure focus on offline tasks.",
    "Day 15: Halfway Mark. Reflect on reaching the mid-point. Write down the hardest challenge you’ve faced so far.",
    "Day 16: Temperature Shock. Take a cold shower for at least the final 2 minutes of your bathing routine.",
    "Day 17: Keyholder’s Choice. (If solo: Assign yourself your least favourite household chore and complete it flawlessly).",
    "Day 18: Phantom Edging. Spend 5 minutes focusing heavily on the physical sensation of the device restricting you.",
    "Day 19: Extended Inspection. Conduct a full skin check. Ensure there is zero pinching or raw skin developing.",
    "Day 20: Mental Journaling. Write a 200-word paragraph detailing exactly how your perception of frustration has changed since Day 1.",
    "Day 21: The 100 Rule. Perform 100 repetitions of any exercise (squats, calf raises, sit-ups) spread throughout the day.",
    "Day 22: Deep Clean Protocol. A meticulous cleaning session. If a keyholder allows an un-lock for hygiene, it must be strictly non-arousing and under 5 minutes.",
    "Day 23: Verbal Compliance. Every time you speak to your keyholder (or log your status online), you must explicitly state your countdown day.",
    "Day 24: Impulse Control. Spend the entire day responding to notifications, messages, and emails only after a 5-minute delay",
    "Day 25: The Silent Night. Spend the hour before bed completely in silence. No music, television, or phones.",
    "Day 26: The Tease Trial. View a highly stimulating piece of media for 3 minutes. You are forbidden to touch or shift the device.",
    "Day 27: Counting Hours. Calculate exactly how many hours remain until November 1st.",
    "Day 28: Reward Planning. Outline the exact conditions, rules, or settings for your eventual release next week.",
    "Day 29: Final Maintenance. Complete the final safety and skin check of the month.",
    "Day 30: The Eve of November. Prepare your release keys, clean clothing, and review your logs from the month.",
    "Day 31: Locktober Complete. Hold the lock until the precise midnight strike or your keyholder's designated release time."
  ];
</script>

<h1 id="title"></h1>
<div class="cover" id="cover-box">no cover photo set — add a URL in COVER_PHOTO_URL above</div>

<div class="grid" id="grid"></div>

<script>
document.getElementById('title').textContent = MONTH_TITLE + ' tracker';

if(COVER_PHOTO_URL){
  const coverBox = document.getElementById('cover-box');
  coverBox.style.backgroundImage = `url(${COVER_PHOTO_URL})`;
  coverBox.textContent = '';
}

const grid = document.getElementById('grid');
const now = new Date();
const thisYear = now.getFullYear();
const MONTH_INDEX = 9; 
TASKS.forEach((taskText, i)=>{
  const d = i + 1;
  const unlockDate = new Date(thisYear, MONTH_INDEX, d);
  const isLocked = now < unlockDate-1;

  const cell = document.createElement('div');
  cell.className = 'cell' + (isLocked ? ' locked' : '');
  cell.innerHTML = `
    <div class="day-num">${d}</div>
    <div class="task">${taskText}</div>
    <div class="scratch-cover"><canvas></canvas></div>
    <div class="lock"><i>&#128274;</i>opens ${MONTH_TITLE.toLowerCase()} ${d}</div>
    <button class="reset" type="button">reset</button>
  `;
  grid.appendChild(cell);

  if(isLocked) return;

  const cover = cell.querySelector('.scratch-cover');
  const canvas = cell.querySelector('canvas');
  const resetBtn = cell.querySelector('.reset');
  const ctx = canvas.getContext('2d');

  function paintCover(){
    const rect = cover.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.fillStyle = '#C9BFA8';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#8A6D4B';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('scratch', canvas.width/2, canvas.height/2);
    cover.style.display = 'block';
  }
  paintCover();

  let scratching = false;
  let clearedPixels = 0;

  function scratchAt(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x,y,16,0,Math.PI*2);
    ctx.fill();
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }
  function checkCleared(){
    clearedPixels++;
    if(clearedPixels > 8){ cover.style.display = 'none'; }
  }

  cover.addEventListener('pointerdown', e=>{
    scratching = true;
    const p = getPos(e);
    scratchAt(p.x, p.y);
    checkCleared();
  });
  cover.addEventListener('pointermove', e=>{
    if(!scratching) return;
    const p = getPos(e);
    scratchAt(p.x, p.y);
    checkCleared();
  });
  window.addEventListener('pointerup', ()=>{ scratching = false; });

  resetBtn.addEventListener('click', ()=>{
    clearedPixels = 0;
    paintCover();
  });
});
</script>

</body>
</html>
